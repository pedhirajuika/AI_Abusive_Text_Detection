<!DOCTYPE html>
<html>
<head>
    <title>Report History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        .alert {
            color: red;
            font-weight: bold;
        }

        .safe {
            color: green;
            font-weight: bold;
        }

        .navigation {
            text-align: center;
            margin-bottom: 20px;
        }

        .navigation a {
            display: inline-block;
            margin: 5px;
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .navigation a:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Report History</h1>

    <div class="navigation">
        <a href="index.html">AI Detection</a>
        <a href="reports.html">Report History</a>
    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Text</th>
                <th>Category</th>
                <th>Severity</th>
                <th>Confidence</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="reportsTable">
        </tbody>

    </table>

</div>

<script>

async function loadReports() {

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/reports"
        );

        const data = await response.json();

        const table = document.getElementById("reportsTable");

        table.innerHTML = "";

        data.reports.forEach(report => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${report.id}</td>
                <td>${report.text}</td>
                <td>${report.category}</td>
                <td>${report.severity}</td>
                <td>${Number(report.confidence).toFixed(2)}%</td>
                <td>${report.action}</td>
            `;

            table.appendChild(row);

        });

    } catch (error) {

        document.getElementById("reportsTable").innerHTML = `
            <tr>
                <td colspan="6">
                    ❌ Unable to load reports.
                </td>
            </tr>
        `;

    }
}

loadReports();

</script>

</body>
</html>
