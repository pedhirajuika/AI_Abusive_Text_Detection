<!DOCTYPE html>
<html>
<head>
    <title>AI Abusive Text Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }

        .safe {
            background: #e8f5e9;
        }

        .alert {
            background: #ffebee;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Abusive Text Detection</h1>

    <p>Enter a message to analyze:</p>

    <textarea id="textInput"
        placeholder="Type your message here..."></textarea>

    <button onclick="detectText()">
        Detect Text
    </button>

    <div id="result"></div>

</div>

<script>

async function detectText() {

    const text = document.getElementById("textInput").value;
    const resultBox = document.getElementById("result");

    if (!text.trim()) {
        alert("Please enter a message.");
        return;
    }

    resultBox.style.display = "block";
    resultBox.innerHTML = "Analyzing...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: text
                })
            }
        );

        const data = await response.json();

        if (data.status === "ALERT") {
            resultBox.className = "alert";
        } else {
            resultBox.className = "safe";
        }

        resultBox.innerHTML = `
            <h2>${data.status}</h2>

            <p><strong>Category:</strong>
            ${data.category}</p>

            <p><strong>Severity:</strong>
            ${data.severity}</p>

            <p><strong>Confidence:</strong>
            ${data.confidence.toFixed(2)}%</p>

            <p><strong>Action:</strong>
            ${data.action}</p>
        `;

    } catch (error) {

        resultBox.style.display = "block";

        resultBox.innerHTML =
            "❌ Unable to connect to the AI API.";

    }
}

</script>

</body>
</html>
